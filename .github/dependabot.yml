# F&F 운영용 포크: 원본이 npm 에 안 올린 의존성 취약점 수정까지 직접 추적한다.
# Dependabot 은 기본 브랜치(main) 만 본다. main 에 머지된 갱신은 release/fnf 로 병합해 새 태그로 낸다
# (절차는 README 상단 "F&F 운영용 포크" 참고).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
