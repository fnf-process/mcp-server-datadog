# Publishes to npm via OIDC trusted publishing (no NPM_TOKEN needed).
# One-time setup on npmjs.com: package -> Settings -> Trusted publishing -> GitHub Actions
#   owner=winor30, repo=mcp-server-datadog, workflow=publish.yml
# Release by bumping the version and pushing a tag like `v1.8.0`.
name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    # F&F 포크 가드: 이 워크플로는 원본(winor30) 의 npm 발행용이다. 포크에서 v*.*.* 태그
    # (예: v1.8.0-fnf.1) 를 올릴 때 돌지 않게 막는다. 원본 소유자 레포에서만 실행된다.
    if: github.repository_owner == 'winor30'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish
        run: npm publish --access public --ignore-scripts --provenance
